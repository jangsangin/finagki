name: 'Integrate vpnhide (built-in)'
description: 'okhsunrog/vpnhide 내장(builtin) 네이티브 백엔드를 최신 소스로 커널에 통합하고 CONFIG_VPNHIDE=y 설정'

inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: true
  commit:
    description: '업스트림 커밋 고정 (비우면 최신)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Apply vpnhide builtin integration
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        up="${RUNNER_TEMP}/vpnhide-upstream"
        rm -rf "$up"
        ok=0
        for attempt in 1 2 3; do
          if git clone --quiet --depth=1 https://github.com/okhsunrog/vpnhide.git "$up"; then
            if [ -n "${{ inputs.commit }}" ]; then
              git -C "$up" fetch --quiet --depth=1 origin "${{ inputs.commit }}" && git -C "$up" checkout --quiet --detach FETCH_HEAD || { rm -rf "$up"; continue; }
            fi
            ok=1; break
          fi
          sleep $((attempt * 5))
        done
        if [ "$ok" != 1 ] || [ ! -f "$up/builtin/scripts/integrate.py" ]; then
          echo "::warning::vpnhide: 업스트림을 받지 못했거나 구조가 달라 건너뜁니다 (커널에 vpnhide 미포함)"
          exit 0
        fi
        echo "vpnhide: 업스트림 사용 ($(git -C "$up" rev-parse --short HEAD))"

        # export 로 먼저 앵커 일치를 확인한다 (커널 파일을 건드리지 않음). 실패하면 건너뛴다.
        if ! python3 "$up/builtin/scripts/integrate.py" export --kernel "$PWD" --kmi ${{ inputs.version }} --output "${RUNNER_TEMP}/vpnhide-export" >/tmp/vpnhide-export.log 2>&1; then
          tail -20 /tmp/vpnhide-export.log
          echo "::warning::vpnhide: 이 커널 소스에는 호출 지점이 맞지 않아 건너뜁니다 (커널에 vpnhide 미포함)"
          exit 0
        fi
        python3 "$up/builtin/scripts/integrate.py" apply --kernel "$PWD" --kmi ${{ inputs.version }} --output "${RUNNER_TEMP}/vpnhide-review"
        test -d security/vpnhide || { echo "::error::vpnhide 적용 후 security/vpnhide 없음"; exit 1; }
        VPNHIDE_APPLIED=true
        echo "VPNHIDE_APPLIED=true" >> "$GITHUB_ENV"

    - name: Enable vpnhide
      if: env.VPNHIDE_APPLIED == 'true'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_VPNHIDE=y
